name: Build and Release LOMA Extended Edition

# Manual trigger only — this is a large PyInstaller build (torch/diffusers/transformers/
# chromadb and friends, heavier than Core Edition's since this build includes the full
# image-generation stack) that can take a long time and burn a lot of Actions minutes on a
# private repo's monthly quota, and per packaging/loma_extended.spec's own "First-build
# note", a new spec almost always needs a follow-up pass or two before it's clean. Run it
# explicitly from the Actions tab (or `gh workflow run build.yml -f version=v1.0.0`).
#
# Builds are delivered as GitHub Release assets, NOT Actions artifacts: this account's plan
# includes only 0.5GB of Actions artifact storage per month and each build here is ~1GB, so
# actions/upload-artifact fails on every run. Release assets aren't counted against that.
# A draft release for the tag is created once up front (so the two build jobs can't race to
# create duplicate drafts), each build uploads its zip into it, and the final job publishes
# it — only when a real version (not the default "dev") was given.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v1.0.0). Leave as 'dev' for an unpublished draft drop-off build."
        required: false
        default: "dev"
      platform:
        description: "Which platform(s) to build"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - windows
          - macos

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.inputs.version }}
    steps:
      - name: Create the draft release if it doesn't exist yet
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            gh release create "$TAG" --repo "${{ github.repository }}" --draft \
              --target "${{ github.sha }}" \
              --title "LOMA Extended Edition $TAG" \
              --notes "Windows: unzip and run 'LOMA Extended Edition.exe'. macOS (Apple Silicon): unzip, run 'xattr -cr' on the .app once, then open it. See the README for details."
          fi

  build-windows:
    needs: create-release
    if: ${{ github.event.inputs.platform == 'both' || github.event.inputs.platform == 'windows' }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # setuptools>=81 removes pkg_resources' legacy Provider classes, which breaks
          # PyInstaller's bundled pyi_rth_pkgres runtime hook — the built app crashes on
          # launch with "AttributeError: module 'pkg_resources' has no attribute
          # 'NullProvider'" before any app code runs (caught by build-macos's smoke-test
          # in run 35503375100; nothing here catches it on Windows, so pin it
          # unconditionally rather than rely on that). torch requires setuptools>=77.0.3,
          # so both bounds must be resolved together in one pip invocation (a separate
          # preceding `pip install setuptools<81` gets silently overridden when
          # requirements.txt is resolved next).
          pip install "setuptools>=77.0.3,<81" -r requirements.txt pyinstaller

      - name: Download bundled embedding model
        # Not committed to git (449MB single file exceeds GitHub's 100MB hard limit) —
        # see services/rag_embeddings.py's _LOCAL_CANDIDATES for why it must land here.
        shell: bash
        run: |
          python -c "from huggingface_hub import snapshot_download; snapshot_download(repo_id='intfloat/multilingual-e5-small', local_dir='embedding-model', allow_patterns=['*.json', '**/*.json', '*.model', '*.safetensors'])"

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean packaging/loma_extended.spec

      - name: Add LICENSE, README, and user guides to the dist folder
        shell: bash
        run: |
          cp LICENSE.txt "dist/LOMA Extended Edition/LICENSE.txt"
          cp packaging/DIST_README_EXTENDED.txt "dist/LOMA Extended Edition/README.txt"
          cp packaging/user_guides/*.docx "dist/LOMA Extended Edition/" || true

      - name: Zip the Windows build
        shell: bash
        run: |
          cd dist
          7z a -tzip "LOMA-Extended-Edition-Windows.zip" "LOMA Extended Edition"

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.inputs.version }}" dist/LOMA-Extended-Edition-Windows.zip --clobber --repo "${{ github.repository }}"

  build-macos:
    needs: create-release
    if: ${{ github.event.inputs.platform == 'both' || github.event.inputs.platform == 'macos' }}
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # See the matching comment in build-windows: setuptools>=81 breaks PyInstaller's
          # pyi_rth_pkgres runtime hook (pkg_resources.NullProvider is gone), which is what
          # run 35503375100's smoke-test just caught here. torch needs setuptools>=77.0.3,
          # so both bounds are resolved in one pip invocation.
          pip install "setuptools>=77.0.3,<81" -r requirements.txt pyinstaller

      - name: Download bundled embedding model
        run: |
          python -c "from huggingface_hub import snapshot_download; snapshot_download(repo_id='intfloat/multilingual-e5-small', local_dir='embedding-model', allow_patterns=['*.json', '**/*.json', '*.model', '*.safetensors'])"

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean packaging/loma_extended.spec

      # ---- Developer ID signing + Apple notarization (only when the secrets exist) ----
      # This is what lets a Mac user download the app in a browser and double-click it with
      # NO Gatekeeper warning and no `xattr` step. It needs a paid Apple Developer account;
      # without the secrets below these steps are skipped and the ad-hoc-signed app from
      # PyInstaller ships as before (see packaging/install_macos.sh for the no-quarantine
      # install route that works in that case).
      #   APPLE_CERT_P12_BASE64  base64 of the "Developer ID Application" certificate (.p12)
      #   APPLE_CERT_PASSWORD    that .p12's password
      #   APPLE_SIGN_IDENTITY    e.g. "Developer ID Application: Your Name (TEAMID)"
      #   APPLE_ID               Apple ID email
      #   APPLE_TEAM_ID          10-character team id
      #   APPLE_APP_PASSWORD     app-specific password for that Apple ID
      - name: Sign with Developer ID
        if: env.APPLE_SIGN_IDENTITY != ''
        run: |
          APP="dist/LOMA Extended Edition.app"
          KC="$RUNNER_TEMP/build.keychain-db"; KC_PW="$(uuidgen)"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          # Notarization requires EVERY Mach-O in the bundle to carry a Developer ID
          # signature + hardened runtime + secure timestamp, not just the main executable.
          find "$APP" -type f -print0 | while IFS= read -r -d '' f; do
            if file "$f" | grep -q "Mach-O"; then
              codesign --force --options runtime --timestamp --sign "$APPLE_SIGN_IDENTITY" "$f"
            fi
          done
          codesign --force --options runtime --timestamp \
            --entitlements packaging/entitlements.plist \
            --sign "$APPLE_SIGN_IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Notarize and staple
        if: env.APPLE_SIGN_IDENTITY != ''
        run: |
          APP="dist/LOMA Extended Edition.app"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" \
            --wait --timeout 90m | tee "$RUNNER_TEMP/notarize.log"
          grep -q "status: Accepted" "$RUNNER_TEMP/notarize.log"
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=2 "$APP"

      # Root cause of the shipped .app showing "is damaged and can't be opened" on a real
      # Mac (not just a CI-log curiosity): running LOMA's build measurably corrupts its
      # OWN on-disk signature (run 35503839114 — smoke-test passed, then the very next
      # codesign check failed with "a sealed resource is missing or invalid" purely from
      # having been executed once; SOTA's simpler app doesn't do this, which is why its
      # build ships fine with the same step order). Moving "verify" before "smoke-test"
      # only fixed what CI *reported* — the smoke-test still ran the exact same bundle
      # that then got zipped and shipped, so the shipped file was the corrupted one the
      # whole time. Smoke-test a disposable COPY instead: the .app that gets verified,
      # zipped, and shipped is never executed by CI at all.
      - name: Copy the app for smoke-testing (never execute the one that ships)
        run: cp -R "dist/LOMA Extended Edition.app" "dist/smoketest-LOMA.app"

      - name: Verify the bundle's code signature
        run: codesign --verify --deep --strict "dist/LOMA Extended Edition.app"

      # The one failure mode a green build doesn't catch is an app that builds fine but
      # dies on launch (SOTA's v1.2.1 shipped exactly this on Apple Silicon: the plist
      # was edited after signing, which invalidated the ad-hoc signature, and the app
      # died instantly with no error dialog). LOMA is a NiceGUI web-server app rather
      # than a native window, so "launches successfully" here means "the local HTTP
      # server actually comes up" — headless (LOMA_BROWSER_OPENED=1 stops it from trying
      # to open a browser tab on the display-less CI runner) on a fixed, known port.
      #
      # run 35503839114 also showed the app respawning itself repeatedly ("Discovering
      # extensions..." logged 4x, "address already in use", 2 orphan processes left at
      # job cleanup) — looks like a multiprocessing spawn re-executing the frozen bundle
      # rather than a single clean worker. That's very likely WHY execution corrupts the
      # bundle's signature (a respawned worker rewriting/relinking something under its own
      # Contents/), but it's flagged for follow-up rather than chased down here — this
      # step now runs against the disposable copy, so it can't affect the shipped file.
      - name: Smoke-test the built app (on the copy)
        run: |
          export LOMA_PORT=8765
          export LOMA_BROWSER_OPENED=1
          export LOMA_SELFTEST=1
          "dist/smoketest-LOMA.app/Contents/MacOS/LOMA Extended Edition" &
          APP_PID=$!
          ok=0
          for i in $(seq 1 60); do
            if ! kill -0 $APP_PID 2>/dev/null; then
              echo "app process exited early"
              exit 1
            fi
            if curl -sf "http://127.0.0.1:$LOMA_PORT/" >/dev/null; then
              ok=1
              break
            fi
            sleep 1
          done
          selftest=""
          if [ "$ok" = "1" ]; then
            # The CI runner is a real Apple Silicon Mac: prove the frozen app can make a
            # verified HTTPS request (the exact failure a Mac user hit — the wizard said
            # "Offline" because stdlib urllib had no CA bundle) and log how many copies of
            # the app are running (a respawn regression shows up as a count > 2).
            selftest=$(curl -s --max-time 40 "http://127.0.0.1:$LOMA_PORT/loma-selftest" || true)
            echo "selftest response: $selftest"
            echo "app processes: $(pgrep -fc 'smoketest-LOMA.app/Contents/MacOS' || true)"
          fi
          kill $APP_PID 2>/dev/null || true
          # Best-effort reap of any respawned workers left bound to the port (see the
          # comment above the step name) — a leftover process holding port 8765 open
          # would otherwise fail the *next* CI run's bind, not just leave this one messy.
          pkill -f "smoketest-LOMA.app/Contents/MacOS" 2>/dev/null || true
          if [ "$ok" != "1" ]; then
            echo "app did not respond on http://127.0.0.1:$LOMA_PORT/ within 60s"
            exit 1
          fi
          case "$selftest" in
            *'"online":true'*) ;;
            *) echo "frozen app could not make a verified HTTPS request: $selftest"; exit 1 ;;
          esac
          case "$selftest" in
            *'"image_imports":"ok"'*) ;;
            *) echo "frozen app cannot import the image-generation libraries: $selftest"; exit 1 ;;
          esac

      - name: Add LICENSE, README, and user guides alongside the .app
        # The plain onedir folder ("dist/LOMA Extended Edition/") is NOT what gets
        # zipped for macOS (see the next step — only the .app bundle is), so copying
        # these into it (as the Windows job does) would silently ship a mac zip with no
        # LICENSE/README at all. Stage a release folder with the .app and the docs as
        # siblings instead, matching SOTA's macOS packaging.
        run: |
          mkdir -p "dist/LOMA-release"
          cp -R "dist/LOMA Extended Edition.app" "dist/LOMA-release/"
          cp LICENSE.txt "dist/LOMA-release/LICENSE.txt"
          cp packaging/DIST_README_EXTENDED.txt "dist/LOMA-release/README.txt"
          cp packaging/user_guides/*.docx "dist/LOMA-release/" || true

      - name: Zip for release upload
        # ditto (not plain zip) is Apple's recommended tool for zipping .app bundles —
        # it preserves bundle metadata/resource forks that plain `zip` can silently drop.
        run: |
          cd dist
          ditto -c -k --keepParent "LOMA-release" "LOMA-Extended-Edition-macOS.zip"

      - name: Upload to the release (bypasses Actions artifact storage)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.inputs.version }}" dist/LOMA-Extended-Edition-macOS.zip --clobber --repo "${{ github.repository }}"

  publish:
    # Only for a real version — the default "dev" tag stays an unpublished draft. The
    # result checks (rather than plain `needs:`) let a platform-scoped run (one build job
    # "skipped") still publish, but never when a build that did run failed or was cancelled.
    if: >
      ${{ always() && github.event.inputs.version != 'dev' &&
          (needs.build-windows.result == 'success' || needs.build-macos.result == 'success') &&
          needs.build-windows.result != 'failure' && needs.build-macos.result != 'failure' &&
          needs.build-windows.result != 'cancelled' && needs.build-macos.result != 'cancelled' }}
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish the release
        run: gh release edit "${{ github.event.inputs.version }}" --repo "${{ github.repository }}" --draft=false --latest
