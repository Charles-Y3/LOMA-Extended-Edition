name: Build and Release LOMA Extended Edition

# Manual trigger only — this is a large PyInstaller build (torch/diffusers/transformers/
# chromadb and friends, heavier than Core Edition's since this build includes the full
# image-generation stack) that can take a long time and burn a lot of Actions minutes on a
# private repo's monthly quota, and per packaging/loma_extended.spec's own "First-build
# note", a new spec almost always needs a follow-up pass or two before it's clean. Run it
# explicitly from the Actions tab (or `gh workflow run build.yml -f version=v0.1.0`) once
# you actually want a build — optionally also creating a GitHub Release from it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v0.1.0) — leave blank to build without publishing a release"
        required: false
        default: ""
      platform:
        description: "Which platform(s) to build"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - windows
          - macos

jobs:
  build-windows:
    if: ${{ github.event.inputs.platform == 'both' || github.event.inputs.platform == 'windows' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # setuptools>=81 removes pkg_resources' legacy Provider classes, which breaks
          # PyInstaller's bundled pyi_rth_pkgres runtime hook — the built app crashes on
          # launch with "AttributeError: module 'pkg_resources' has no attribute
          # 'NullProvider'" before any app code runs (caught by build-macos's smoke-test
          # in run 35503375100; nothing here catches it on Windows, so pin it
          # unconditionally rather than rely on that). torch requires setuptools>=77.0.3,
          # so both bounds must be resolved together in one pip invocation (a separate
          # preceding `pip install setuptools<81` gets silently overridden when
          # requirements.txt is resolved next).
          pip install "setuptools>=77.0.3,<81" -r requirements.txt pyinstaller

      - name: Download bundled embedding model
        # Not committed to git (449MB single file exceeds GitHub's 100MB hard limit) —
        # see services/rag_embeddings.py's _LOCAL_CANDIDATES for why it must land here.
        shell: bash
        run: |
          python -c "from huggingface_hub import snapshot_download; snapshot_download(repo_id='intfloat/multilingual-e5-small', local_dir='embedding-model', allow_patterns=['*.json', '**/*.json', '*.model', '*.safetensors'])"

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean packaging/loma_extended.spec

      - name: Add LICENSE, README, and user guides to the dist folder
        shell: bash
        run: |
          cp LICENSE.txt "dist/LOMA Extended Edition/LICENSE.txt"
          cp packaging/DIST_README_EXTENDED.txt "dist/LOMA Extended Edition/README.txt"
          cp packaging/user_guides/*.docx "dist/LOMA Extended Edition/" || true

      - name: Zip the Windows build
        shell: bash
        run: |
          cd dist
          7z a -tzip "LOMA-Extended-Edition-Windows.zip" "LOMA Extended Edition"

      - uses: actions/upload-artifact@v4
        with:
          name: LOMA-Extended-Edition-Windows
          path: dist/LOMA-Extended-Edition-Windows.zip
          retention-days: 14

  build-macos:
    if: ${{ github.event.inputs.platform == 'both' || github.event.inputs.platform == 'macos' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # See the matching comment in build-windows: setuptools>=81 breaks PyInstaller's
          # pyi_rth_pkgres runtime hook (pkg_resources.NullProvider is gone), which is what
          # run 35503375100's smoke-test just caught here. torch needs setuptools>=77.0.3,
          # so both bounds are resolved in one pip invocation.
          pip install "setuptools>=77.0.3,<81" -r requirements.txt pyinstaller

      - name: Download bundled embedding model
        run: |
          python -c "from huggingface_hub import snapshot_download; snapshot_download(repo_id='intfloat/multilingual-e5-small', local_dir='embedding-model', allow_patterns=['*.json', '**/*.json', '*.model', '*.safetensors'])"

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean packaging/loma_extended.spec

      # Verify BEFORE the smoke-test, not after: actually launching the app can mutate
      # the on-disk bundle enough to break its ad-hoc signature's sealed-resource manifest
      # (confirmed in run 35503839114 — smoke-test passed, but the next step then failed
      # with "a sealed resource is missing or invalid" because the app had run in between).
      # Checking the pristine, never-executed bundle here means this verifies exactly what
      # actually ships in the zip, and isn't at the mercy of what running it does to it.
      - name: Verify the bundle's code signature
        run: codesign --verify --deep --strict "dist/LOMA Extended Edition.app"

      # The one failure mode a green build doesn't catch is an app that builds fine but
      # dies on launch (SOTA's v1.2.1 shipped exactly this on Apple Silicon: the plist
      # was edited after signing, which invalidated the ad-hoc signature, and the app
      # died instantly with no error dialog). LOMA is a NiceGUI web-server app rather
      # than a native window, so "launches successfully" here means "the local HTTP
      # server actually comes up" — headless (LOMA_BROWSER_OPENED=1 stops it from trying
      # to open a browser tab on the display-less CI runner) on a fixed, known port.
      #
      # run 35503839114 also showed the app respawning itself repeatedly ("Discovering
      # extensions..." logged 4x, "address already in use", 2 orphan processes left at
      # job cleanup) — looks like a multiprocessing spawn re-executing the frozen bundle
      # rather than a single clean worker. Not chased down here (this step's job is
      # launch-or-not, and it still correctly detects the first successful bind); flagged
      # separately since it's a real app-behavior question, not a packaging/CI one.
      - name: Smoke-test the built app
        run: |
          export LOMA_PORT=8765
          export LOMA_BROWSER_OPENED=1
          "dist/LOMA Extended Edition.app/Contents/MacOS/LOMA Extended Edition" &
          APP_PID=$!
          ok=0
          for i in $(seq 1 60); do
            if ! kill -0 $APP_PID 2>/dev/null; then
              echo "app process exited early"
              exit 1
            fi
            if curl -sf "http://127.0.0.1:$LOMA_PORT/" >/dev/null; then
              ok=1
              break
            fi
            sleep 1
          done
          kill $APP_PID 2>/dev/null || true
          # Best-effort reap of any respawned workers left bound to the port (see the
          # comment above the step name) — a leftover process holding port 8765 open
          # would otherwise fail the *next* CI run's bind, not just leave this one messy.
          pkill -f "LOMA Extended Edition.app/Contents/MacOS" 2>/dev/null || true
          if [ "$ok" != "1" ]; then
            echo "app did not respond on http://127.0.0.1:$LOMA_PORT/ within 60s"
            exit 1
          fi

      - name: Add LICENSE, README, and user guides alongside the .app
        # The plain onedir folder ("dist/LOMA Extended Edition/") is NOT what gets
        # zipped for macOS (see the next step — only the .app bundle is), so copying
        # these into it (as the Windows job does) would silently ship a mac zip with no
        # LICENSE/README at all. Stage a release folder with the .app and the docs as
        # siblings instead, matching SOTA's macOS packaging.
        run: |
          mkdir -p "dist/LOMA-release"
          cp -R "dist/LOMA Extended Edition.app" "dist/LOMA-release/"
          cp LICENSE.txt "dist/LOMA-release/LICENSE.txt"
          cp packaging/DIST_README_EXTENDED.txt "dist/LOMA-release/README.txt"
          cp packaging/user_guides/*.docx "dist/LOMA-release/" || true

      - name: Zip the macOS .app bundle
        # ditto (not plain zip) is Apple's recommended tool for zipping .app bundles —
        # it preserves bundle metadata/resource forks that plain `zip` can silently drop.
        run: |
          cd dist
          ditto -c -k --keepParent "LOMA-release" "LOMA-Extended-Edition-macOS.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: LOMA-Extended-Edition-macOS
          path: dist/LOMA-Extended-Edition-macOS.zip
          retention-days: 14

  release:
    # Only runs when a version was actually supplied — a plain build-and-inspect run (blank
    # version input) skips publishing anything, matching this workflow's existing
    # "don't spend a release on an unverified first build" caution. needs.*.result checks
    # (rather than plain `needs:`) because a platform-scoped run (platform: windows/macos)
    # leaves the other build job "skipped", not "success" — this must still proceed as long
    # as whichever job(s) were supposed to run actually succeeded.
    if: >
      ${{ always() && github.event.inputs.version != '' &&
          (needs.build-windows.result == 'success' || needs.build-macos.result == 'success') &&
          needs.build-windows.result != 'failure' && needs.build-macos.result != 'failure' }}
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: LOMA-Extended-Edition-Windows
          path: release-assets

      - name: Download macOS artifact
        if: needs.build-macos.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: LOMA-Extended-Edition-macOS
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: LOMA Extended Edition ${{ github.event.inputs.version }}
          draft: true
          files: release-assets/*.zip
